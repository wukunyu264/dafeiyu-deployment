name: astrbot_plugin_web_sense
display_name: 网页天气热搜感知
desc: 主人私聊时自动感知：消息里有链接就抓正文、说「天气」就查实时天气、说「热搜/新闻」就抓百度热搜前十，结果直接注入上下文，不依赖模型主动调用工具。
help: 装上即用，只对主人私聊生效。环境变量 OWNER_QQ / WEB_SENSE_CITY / WEB_SENSE_MAX 可选。
version: v0.1.0
author: wukunyu
repo: https://github.com/wukunyu264/dafeiyu-deployment
support_platforms:
  - aiocqhttp
